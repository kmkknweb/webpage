<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ประวัติศาลเจ้า</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Kanit',sans-serif;
  background:#1a0202;
  color:#fff4d2;
}

.container{
  max-width:900px;
  margin:auto;
  padding:16px;
}

/* ===== HERO ===== */
.hero{
  position:relative;
}

.hero img{
  width:100%;
  display:block;
}

.overlay{
  position:absolute;
  bottom:20px;
  left:16px;
}

.header-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.title{
  background:linear-gradient(135deg,#ffe6a3,#d89b31);
  color:#3b1005;
  padding:6px 12px;
  border-radius:999px;
  font-weight:800;
}

.sound-btn{
  background:#3a0606;
  border:1px solid #f2c36b;
  color:#fff;
  padding:6px 10px;
  border-radius:999px;
  cursor:pointer;
}

/* ===== TEXT ===== */
h1{
  margin:14px 0;
  font-size:28px;
}

p{
  line-height:1.8;
  color:#ffeccc;
}

/* ===== IMAGE BLOCK ===== */
.img-card{
  margin-top:20px;
  background:#fff8e6;
  border-radius:16px;
  overflow:hidden;
  color:#3b1005;
}

.img-card img{
  width:100%;
  display:block;
}

.caption{
  padding:10px;
  font-size:14px;
}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }
}

/* ===== BUTTON ===== */
.btn{
  display:block;
  margin-top:20px;
  text-align:center;
  padding:14px;
  background:linear-gradient(135deg,#ffe6a3,#d89b31);
  border-radius:999px;
  color:#3b1005;
  text-decoration:none;
  font-weight:700;
}
</style>
</head>

<body>

<div class="container">

<!-- HERO -->
<div class="hero">
  <img src="images/shrine-night-front.jpg">

  <div class="overlay">
    <div class="header-row">
      <div class="title">🏮 ประวัติศาลเจ้า</div>
      <button id="soundBtn" class="sound-btn">♪</button>
    </div>
  </div>
</div>

<h1>จากอดีตสู่ปัจจุบัน</h1>

<p>
ศาลเจ้าปึงเถ่ากงม่า ขอนแก่น ได้ก่อสร้างอยู่ในบริเวณศาลเจ้าปู่ครูเย็น
ตั้งแต่ปี พ.ศ. 2504 และได้รับการพัฒนาเรื่อยมาจนถึงปัจจุบัน
</p>

<!-- อดีต -->
<div class="img-card">
  <img src="images/history-old-group.jpg">
  <div class="caption">คณะผู้เกี่ยวข้องในอดีต</div>
</div>

<div class="img-card">
  <img src="images/history-old-collage.jpg">
  <div class="caption">ศาลเจ้าในอดีต</div>
</div>

<!-- ปัจจุบัน -->
<div class="grid">

  <div class="img-card">
    <img src="images/shrine-day.jpg">
    <div class="caption">ศาลเจ้าช่วงกลางวัน</div>
  </div>

  <div class="img-card">
    <img src="images/shrine-night-front.jpg">
    <div class="caption">ศาลเจ้ายามค่ำคืน</div>
  </div>

  <div class="img-card">
    <img src="images/shrine-interior.jpg">
    <div class="caption">ภายในศาลเจ้า</div>
  </div>

  <div class="img-card">
    <img src="images/shrine-moon-night.jpg">
    <div class="caption">บรรยากาศกลางคืน</div>
  </div>

</div>

<a href="map.html" class="btn">← กลับหน้าแผนที่</a>

</div>

<audio id="audio" loop>
  <source src="audio/shrine-ambient.mp3" type="audio/mpeg">
</audio>

<script>
const btn = document.getElementById("soundBtn");
const audio = document.getElementById("audio");
let playing = false;

btn.onclick = async () => {
  if(!playing){
    try{
      await audio.play();
      playing = true;
      btn.innerText = "🔊";
    }catch(e){}
  }else{
    audio.pause();
    audio.currentTime = 0;
    playing = false;
    btn.innerText = "♪";
  }
};

window.addEventListener("beforeunload",()=>{
  audio.pause();
});
</script>

</body>
</html>

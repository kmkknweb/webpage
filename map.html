<!DOCTYPE html><html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แผนที่ | สมาคมปึงเถ่ากงม่า ขอนแก่น</title>  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: linear-gradient(180deg, #2b0505, #090101);
      padding: 12px;
    }

    .map-container {
      max-width: 1000px;
      margin: auto;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      position: relative;
    }

    .map-image {
      width: 100%;
      display: block;
    }

    /* ✨ ว้าว: glow ตำแหน่ง */
    .pin {
      position: absolute;
      left: 64%;
      top: 15%;
      width: 90px;
      height: 90px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
    }

    .pin::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(255,215,120,0.9);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    /* ✨ Mini map overlay header */
    .map-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 14px 18px;
      background: linear-gradient(180deg, rgba(0,0,0,0.6), transparent);
      color: #fff4d2;
    }

    .map-title {
      font-size: 18px;
      font-weight: 800;
    }

    .map-sub {
      font-size: 13px;
      opacity: 0.85;
    }

    /* ✨ ปุ่มล่าง */
    .map-footer {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: bold;
    }

    .btn-map {
      background: linear-gradient(135deg,#ffe6a3,#d89b31);
      color: #3b1005;
    }

    .btn-back {
      background: rgba(80,0,0,0.7);
      color: #fff;
    }

  </style></head>
<body><div class="map-container">  <img src="images/location-map.jpg" class="map-image">  <div class="map-header">
    <div class="map-title">📍 แผนที่ศาลเจ้า</div>
    <div class="map-sub">สมาคมปึงเถ่ากงม่า ขอนแก่น</div>
  </div><a class="pin" href="https://maps.google.com/?q=San+Chao+Pung+Thao+Kong-Ma+Khon+Kaen" target="_blank"></a>

  <div class="map-footer">
    <a class="btn btn-back" href="../webapp.html">← กลับ</a>
    <a class="btn btn-map" href="https://maps.google.com/?q=San+Chao+Pung+Thao+Kong-Ma+Khon+Kaen" target="_blank">🧭 นำทาง</a>
  </div></div></body>
</html>

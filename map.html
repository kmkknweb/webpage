<!DOCTYPE html><html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แผนที่ | สมาคมปึงเถ่ากงม่า ขอนแก่น</title>  <style>
    :root {
      --red: #7b1010;
      --deep-red: #3a0606;
      --gold: #f4c45f;
      --cream: #fff4d2;
      --text: #fff7df;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(244, 196, 95, 0.16), transparent 38%),
        linear-gradient(180deg, #2b0505 0%, #090101 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 14px;
    }

    .map-page {
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .map-frame {
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      box-shadow: var(--shadow);
      background: #210404;
      border: 1px solid rgba(244, 196, 95, 0.35);
    }

    .map-image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .map-actions {
      position: absolute;
      right: clamp(14px, 3vw, 34px);
      bottom: clamp(14px, 3vw, 34px);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
      z-index: 5;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 12px 20px;
      border-radius: 999px;
      border: 1px solid rgba(255, 224, 139, 0.55);
      text-decoration: none;
      font-weight: 800;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(12px);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-map {
      color: #351602;
      background: linear-gradient(135deg, #ffe6a3, #d89b31);
    }

    .btn-home {
      color: var(--cream);
      background: rgba(90, 8, 8, 0.82);
    }

    .tap-pin {
      position: absolute;
      left: 64%;
      top: 15%;
      width: 100px;
      height: 100px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 4;
    }

    .tap-pin::after {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 2px solid rgba(255, 223, 126, 0.8);
      animation: pulse 1.8s ease-out infinite;
      pointer-events: none;
    }

    @keyframes pulse {
      from {
        transform: scale(0.55);
        opacity: 0.9;
      }
      to {
        transform: scale(1.35);
        opacity: 0;
      }
    }

    @media (max-width: 720px) {
      body {
        padding: 8px;
      }

      .map-frame {
        border-radius: 22px;
      }

      .map-image {
        width: 140%;
        max-width: none;
        margin-left: -22%;
      }

      .map-actions {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 14px;
      }

      .btn {
        flex: 1;
        min-height: 50px;
        padding: 12px 14px;
        font-size: 15px;
      }

      .tap-pin {
        left: 67%;
        top: 14%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .tap-pin::after {
        animation: none;
      }
    }
  </style></head>
<body>
  <main class="map-page">
    <section class="map-frame" aria-label="แผนที่สมาคมปึงเถ่ากงม่า ขอนแก่น">
      <!-- เปลี่ยนชื่อไฟล์ภาพแผนที่ให้ตรงกับของจริง เช่น images/location-map.jpg -->
      <img
        class="map-image"
        src="images/location-map.jpg"
        alt="แผนที่การเดินทางไปสมาคมปึงเถ่ากงม่า ขอนแก่น"
      /><!-- กดที่ตำแหน่งหมุดศาลเจ้าเพื่อเปิด Google Maps ได้ -->
  <a
    class="tap-pin"
    href="https://maps.google.com/?q=San+Chao+Pung+Thao+Kong-Ma+Khon+Kaen"
    target="_blank"
    rel="noopener"
    aria-label="เปิดตำแหน่งศาลเจ้าใน Google Maps"
  ></a>

  <div class="map-actions">
    <a
      class="btn btn-map"
      href="https://maps.google.com/?q=San+Chao+Pung+Thao+Kong-Ma+Khon+Kaen"
      target="_blank"
      rel="noopener"
    >
      🧭 นำทาง
    </a>

    <a class="btn btn-home" href="index.html">
      กลับหน้าแรก
    </a>
  </div>
</section>

  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แผนที่ศาลเจ้า</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ===== BASE ===== */
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
}

body{
  font-family:'Kanit',sans-serif;
  background:
    radial-gradient(circle at top, rgba(242,195,107,.18), transparent 34%),
    linear-gradient(180deg,#2b0505 0%,#160202 58%,#090000 100%);
  color:#fff4d2;
}

/* ===== MAP AREA ===== */
.map-wrap{
  max-width:900px;
  margin:0 auto;
  padding:14px;
}

.map-card{
  position:relative;
  overflow:hidden;
  border-radius:26px 26px 0 0;
  background:#120202;
  border:1px solid rgba(242,195,107,.34);
  border-bottom:none;
  box-shadow:0 20px 55px rgba(0,0,0,.42);
}

.map-card::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:2;
  background:
    radial-gradient(circle at 64% 15%, rgba(255,220,130,.30), transparent 16%),
    linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.18));
}

.map-card::after{
  content:"";
  position:absolute;
  top:-40%;
  bottom:-40%;
  width:36%;
  left:-50%;
  z-index:3;
  pointer-events:none;
  background:linear-gradient(110deg, transparent, rgba(255,239,190,.28), transparent);
  transform:skewX(-18deg);
  animation:ptkmLightSweep 7s ease-in-out infinite;
}

.map-img{
  width:100%;
  display:block;
}

/* จุดเรืองแสง: ไม่เปลี่ยนโครงภาพ */
.map-hotspot{
  position:absolute;
  left:64%;
  top:15%;
  width:82px;
  height:82px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  z-index:4;
  text-decoration:none;
  -webkit-tap-highlight-color:transparent;
}

.map-hotspot::before,
.map-hotspot::after{
  content:"";
  position:absolute;
  inset:12px;
  border-radius:50%;
  border:2px solid rgba(255,224,139,.95);
  box-shadow:0 0 26px rgba(242,195,107,.72);
  animation:ptkmPulse 2.1s ease-out infinite;
}

.map-hotspot::after{
  animation-delay:.72s;
}

.map-pin-label{
  position:absolute;
  left:64%;
  top:15%;
  transform:translate(22px,-42px);
  z-index:5;
  padding:7px 12px;
  border-radius:999px;
  background:linear-gradient(135deg,#fff0b8,#d99b31);
  color:#3b1005;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  box-shadow:0 10px 26px rgba(0,0,0,.35);
  animation:ptkmFloat 3s ease-in-out infinite;
  pointer-events:none;
}

/* ===== FOOTER INFO ===== */
.footer{
  padding:18px;
  background:
    linear-gradient(135deg, rgba(80,8,8,.98), rgba(38,3,3,.98));
  color:#fff4d2;
  border:1px solid rgba(242,195,107,.34);
  border-top:none;
  border-radius:0 0 26px 26px;
  box-shadow:0 20px 55px rgba(0,0,0,.34);
}

.footer h2{
  margin:0 0 6px;
  font-size:18px;
  line-height:1.35;
  font-weight:800;
}

.footer div{
  font-weight:400;
}

.buttons{
  margin-top:14px;
  display:flex;
  gap:10px;
}

.btn{
  flex:1;
  text-align:center;
  padding:12px 14px;
  border-radius:999px;
  text-decoration:none;
  font-weight:800;
  transition:transform .22s ease, box-shadow .22s ease, filter .22s ease;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn:active{
  transform:scale(.98);
}

.btn-map{
  background:linear-gradient(135deg,#fff0b8,#d99b31);
  color:#3b1005;
  box-shadow:0 10px 26px rgba(216,155,49,.22);
}

.btn-back{
  background:rgba(107,13,13,.92);
  color:#fff;
  border:1px solid rgba(242,195,107,.22);
}

/* ===== SOCIAL FOLLOW BAR ===== */
.social-follow{
  margin:30px auto 22px;
  padding:24px 18px;
  max-width:1000px;
  border-radius:30px;
  background:
    radial-gradient(circle at top, rgba(255,235,185,.65), transparent 42%),
    linear-gradient(180deg,#fffef8 0%,#fff7e6 100%);
  border:1px solid rgba(255,255,255,.74);
  box-shadow:
    0 20px 54px rgba(255,230,170,.24),
    0 0 52px rgba(255,244,210,.28);
  text-align:center;
  animation:ptkmFadeUp .9s ease both;
}

.social-follow-title{
  font-size:22px;
  color:#8a4306;
  margin:0 0 16px;
  font-weight:800;
  letter-spacing:-.01em;
}

.social-follow-links{
  display:flex;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
}

.social-link{
  width:64px;
  height:64px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  text-decoration:none;
  transition:transform .28s ease, filter .28s ease;
  position:relative;
  box-shadow:0 10px 26px rgba(0,0,0,.13);
}

.social-link:hover{
  transform:translateY(-5px) scale(1.07);
  filter:brightness(1.06);
}

.social-link::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:inherit;
  filter:blur(18px);
  opacity:.45;
  z-index:-1;
}

.facebook{ background:linear-gradient(180deg,#1877f2,#0f5bd4); }
.tiktok{ background:linear-gradient(180deg,#111,#333); }
.youtube{ background:linear-gradient(180deg,#ff0000,#c40000); }
.line{ background:linear-gradient(180deg,#06c755,#04a847); }

.hero,
.top-section,
.page{
  overflow-y:visible;
}

/* ===== ANIMATION ===== */
@keyframes ptkmLightSweep{
  0%,42%{ left:-52%; opacity:0; }
  52%{ opacity:.9; }
  78%,100%{ left:116%; opacity:0; }
}

@keyframes ptkmPulse{
  0%{ transform:scale(.48); opacity:1; }
  100%{ transform:scale(1.52); opacity:0; }
}

@keyframes ptkmFloat{
  0%,100%{ transform:translate(22px,-42px); }
  50%{ transform:translate(26px,-48px); }
}

@keyframes ptkmFadeUp{
  from{ opacity:0; transform:translateY(18px); }
  to{ opacity:1; transform:translateY(0); }
}

/* ===== MOBILE ===== */
@media(max-width:640px){
  .map-wrap{
    padding:10px;
  }

  .map-card{
    border-radius:20px 20px 0 0;
  }

  .footer{
    border-radius:0 0 20px 20px;
    padding:16px;
  }

  .footer h2{
    font-size:16px;
  }

  .buttons{
    gap:8px;
  }

  .btn{
    padding:12px 10px;
    font-size:14px;
  }

  .map-hotspot{
    width:70px;
    height:70px;
  }

  .map-pin-label{
    font-size:11px;
    transform:translate(18px,-38px);
  }

  .social-follow{
    margin:24px 10px 18px;
    padding:22px 14px;
    border-radius:24px;
  }

  .social-follow-title{
    font-size:20px;
  }

  .social-link{
    width:58px;
    height:58px;
  }
}

@media(prefers-reduced-motion:reduce){
  .map-card::after,
  .map-hotspot::before,
  .map-hotspot::after,
  .map-pin-label,
  .social-follow{
    animation:none;
  }
}
</style>
</head>

<body>

<div class="map-wrap">

    <img src="images/location-map.png" class="map-img" alt="แผนที่สมาคมปึงเถ่ากงม่า ขอนแก่น">

    <a class="map-hotspot"
       href="https://maps.google.com/?q=San+Chao+Pung+Thao+Kong-Ma+Khon+Kaen"

       rel="noopener"

  </div>
</div>

</body>
